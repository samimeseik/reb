    phase: day 0-90
    en: Size the line from the bottleneck machine back to demand; allow for allergen changeovers.
    ar: تحجيم الخط من ماكينة عنق الزجاجة رجوعاً إلى الطلب مع حساب وقت تغيير المنتجات لمسببات الحساسية.
