# Ready-made archetypes = a family + pattern modules + specifics.
# Each gives the starting blueprint (all hypotheses at LOW confidence) that
# traces about the specific organization then confirm, refute or refine.
# Build-step costs are deliberately omitted: they depend on country and year and
# must come from evidence (quotes, listings), not from this library.
