    ar: إعداد الموازنة وتوزيعها
  - en: Service delivery through directorates / field offices
    ar: تقديم الخدمات عبر المديريات والمكاتب الميدانية
  - en: Licensing and inspection
    ar: الترخيص والتفتيش
  - en: Monitoring and performance reporting
    ar: المتابعة وتقارير الأداء
  roles:
  - en: Minister (political)
    ar: الوزير (سياسي)
  - en: Deputy ministers / undersecretary (administrative)
    ar: وكلاء الوزارة أو المستشار (إداري)
  - en: General directorates per sector
    ar: مديريات عامة لكل قطاع
  - en: Support directorates (HR, finance, legal, IT, procurement)
    ar: مديريات مساندة (موارد بشرية، مالية، قانونية، تقنية، مشتريات)
  - en: Provincial directorates
    ar: المديريات الإقليمية
  components:
    team:
    - en: The organization chart has one minister, a deputy layer, sector general directorates and support directorates, set by the organizational
        regulation.
      ar: الهيكل فيه وزير وطبقة وكلاء ومديريات عامة قطاعية ومديريات مساندة، تحددها اللائحة التنظيمية.
      impact: high
      test: Find the organizational regulation or chart in the official gazette or on the ministry site.
    - en: Ministries can include law-enforcement arms (for example customs enforcement) and administrations for special zones (free zones).
      ar: قد تضم الوزارات أذرعاً للإنفاذ (مثل إنفاذ الجمارك) وإدارات لمناطق خاصة (المناطق الحرة).
      impact: medium
      test: Read the full list of general directorates.
    revenue_model:
    - en: Funding is the budget-law allocation by programme; fees collected go mostly to the treasury.
      ar: التمويل مخصصات قانون الموازنة حسب البرنامج، والرسوم المحصلة تذهب غالباً للخزينة.
      impact: high
      test: Read the ministry's lines in the latest budget law.
    - en: A revolving fund may finance part of operations next to the budget.
      ar: قد يموّل صندوق دوّار جزءاً من العمليات بجانب الموازنة.
      impact: medium
      test: Look for a revolving-fund unit or line in the budget.
    operations:
    - en: Field delivery may run through regional directorates covering several provinces rather than one office per province.
      ar: قد يتم التنفيذ الميداني عبر مديريات إقليمية تغطي عدة محافظات بدل مكتب في كل محافظة.
      impact: medium
      test: Count field units and their seats.
  build:
  - component: identity
    phase: design
    en: Write the mandate into a founding law before designing units.
    ar: كتابة التفويض في قانون إنشاء قبل تصميم الوحدات.
  - component: team
    phase: design
    en: Design units around services delivered to citizens, then add support directorates.
    ar: تصميم الوحدات حول الخدمات المقدمة للمواطن، ثم إضافة المديريات المساندة.
