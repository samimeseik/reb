    ar: رئيس الطهاة أو رئيس الباريستا
  - en: Kitchen staff
    ar: طاقم المطبخ
  - en: Service staff
    ar: طاقم الخدمة
  components:
    economics:
    - en: Food and beverage cost, staff and rent are the three largest cost lines.
      ar: تكلفة الطعام والشراب والطاقم والإيجار هي أكبر ثلاثة بنود.
      impact: high
      range:
        low: 25
        high: 38
        unit: '% of sales (food & beverage cost)'
      test: Price 5 menu items' ingredients and compare with menu prices.
    assets:
    - en: Larger chains often own central production (roasting, chocolate, pastry, ice cream) that supplies the stores and a packaged-retail line.
      ar: السلاسل الكبيرة تملك غالباً إنتاجاً مركزياً (تحميص، شوكولاتة، معجنات، آيس كريم) يزوّد الفروع وخط منتجات معبأة للبيع.
      impact: high
      test: Look for a production / factory page and packaged products sold online.
    operations:
    - en: Some items are produced centrally while others (bread, sandwiches) are finished in store.
      ar: بعض الأصناف تُنتَج مركزياً وأخرى (خبز، ساندويتشات) تُجهَّز في الفرع.
      impact: medium
      test: Read the production page; visit a store at opening time.
    revenue_model:
    - en: Franchising may be used only for expansion abroad (master franchise per country) while home-market stores stay company-operated.
      ar: قد يُستخدم الامتياز للتوسع الخارجي فقط (امتياز رئيسي لكل دولة)، بينما تبقى فروع البلد الأم مملوكة للشركة.
      impact: high
      test: Read the franchise page and its FAQ.
    offer:
    - en: Several store formats exist (full café, grab-and-go, drive-through, flagship).
      ar: توجد عدة أشكال للفروع (مقهى كامل، استلام سريع، خدمة السيارات، فرع رئيسي).
      impact: medium
      test: Check the store-concept or franchise page.
  build:
  - component: economics
    phase: day 0-30
    en: Cost every menu item and remove items below target margin.
    ar: تسعير تكلفة كل صنف وحذف الأصناف تحت الهامش المستهدف.
