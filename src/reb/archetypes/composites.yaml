    partners:
    - en: Raw materials of agricultural origin come through contract farming with seasonal advances to farmers.
      ar: المواد الزراعية تأتي عبر الزراعة التعاقدية مع سلف موسمية للمزارعين.
      impact: high
      test: Look for contract-farming pages or farmer programmes.
    team:
    - en: The workforce has a permanent core plus seasonal workers at harvest peaks.
      ar: القوى العاملة نواة دائمة مع عمال موسميين في ذروة الحصاد.
      impact: medium
      test: Compare year-end headcount with seasonal job ads.
    assets:
    - en: 'Several plants usually specialize: seasonal processing lines vs year-round lines (sauces, ready meals).'
      ar: 'تتخصص المصانع المتعددة غالباً: خطوط معالجة موسمية مقابل خطوط تعمل طوال العام (صلصات، وجبات جاهزة).'
